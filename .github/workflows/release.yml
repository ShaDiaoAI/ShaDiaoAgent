# GitHub Actions: 打包并发布到 GitHub Releases
#
# 触发条件：推送 v* tag（如 v1.0.7）
# 产物：macOS arm64 + Windows x64 上传到 GitHub Releases
#       macOS x64 由本地打包上传（见 scripts/release-cos-x64.sh）
#
# 为什么不直接在 CI 里传 COS：GitHub runner 在境外、COS 在上海，跨境外网上传太慢
# （常规域名 1.5h+，全球加速也提速有限），故改为：
#   CI → GitHub Releases（站内快）→ 开发者本地下载 → 手工传 COS（国内快）
# 手工传 COS 见 scripts/upload-cos-github.sh
#
# 所需 GitHub Secrets：
# - COS_BUCKET：bucket 全名（如 shadiaoai-1451923852），用于生成应用内更新 URL
# - COS_REGION：地域（如 ap-shanghai），用于生成应用内更新 URL
# - MAC_CERTS / MAC_CERTS_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID：macOS 签名/公证（可选）
# GITHUB_TOKEN 由 GitHub Actions 自动提供

name: Release to GitHub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac-arm64:
    name: build (macos-latest, mac, arm64)
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # macOS 代码签名准备（仅在配置了证书时执行）
      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          if [ -z "$MAC_CERTS" ]; then
            echo "MAC_CERTS 未配置，跳过签名证书导入"
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$MAC_CERTS" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$MAC_CERTS_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          rm $RUNNER_TEMP/cert.p12

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 同步运行时依赖
        run: bun run --filter='@shadiao/electron' sync:runtime-deps
        working-directory: .

      - name: 打包 (macOS arm64)
        env:
          SHADIAO_UPDATE_URL: https://${{ secrets.COS_BUCKET }}.cos.${{ secrets.COS_REGION }}.myqcloud.com/downloads/mac-arm64/
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$SHADIAO_UPDATE_URL" ]; then
            echo "::error::SHADIAO_UPDATE_URL 未设置"
            exit 1
          fi
          echo "update URL: $SHADIAO_UPDATE_URL"
          success=0
          for i in 1 2 3; do
            echo "electron-builder attempt $i/3..."
            if npx electron-builder --mac --arm64; then
              success=1
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          if [ "$success" -eq 0 ]; then
            echo "::error::electron-builder failed after 3 attempts"
            exit 1
          fi
        working-directory: apps/electron

      - name: 整理发布文件 (macOS arm64)
        run: |
          mkdir -p release-files
          cp out/ShaDiaoAgent-*-arm64.dmg release-files/
          cp out/ShaDiaoAgent-*-arm64.zip release-files/
          cp out/ShaDiaoAgent-*-arm64.*.blockmap release-files/
          cp out/latest-mac.yml release-files/
          ls -la release-files/
        working-directory: apps/electron

      - name: 发布到 GitHub Releases (macOS arm64)
        uses: softprops/action-gh-release@v2
        with:
          files: apps/electron/release-files/*
          generate_release_notes: true

  build-windows-x64:
    name: build (windows-latest, win, x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: bun install --frozen-lockfile
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: 0

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 同步运行时依赖
        run: bun run --filter='@shadiao/electron' sync:runtime-deps
        working-directory: .

      - name: 打包 (Windows x64)
        env:
          SHADIAO_UPDATE_URL: https://${{ secrets.COS_BUCKET }}.cos.${{ secrets.COS_REGION }}.myqcloud.com/downloads/windows/
        shell: bash
        run: |
          if [ -z "$SHADIAO_UPDATE_URL" ]; then
            echo "::error::SHADIAO_UPDATE_URL 未设置"
            exit 1
          fi
          echo "update URL: $SHADIAO_UPDATE_URL"
          success=0
          for i in 1 2 3; do
            echo "electron-builder attempt $i/3..."
            if npx electron-builder --win --x64; then
              success=1
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          if [ "$success" -eq 0 ]; then
            echo "::error::electron-builder failed after 3 attempts"
            exit 1
          fi
        working-directory: apps/electron

      - name: 整理发布文件 (Windows x64)
        shell: bash
        run: |
          mkdir -p release-files
          cp out/ShaDiaoAgent-Setup-*.exe release-files/
          cp out/ShaDiaoAgent-Setup-*.exe.blockmap release-files/
          cp out/latest.yml release-files/
          ls -la release-files/
        working-directory: apps/electron

      - name: 发布到 GitHub Releases (Windows x64)
        uses: softprops/action-gh-release@v2
        with:
          files: apps/electron/release-files/*
          generate_release_notes: true
