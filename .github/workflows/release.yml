# GitHub Actions: 打包并发布到 GitHub Releases
#
# 触发条件：推送 v* tag（如 v1.0.7）
# 产物：macOS arm64 + Windows x64 上传到 GitHub Releases
#       macOS x64 由本地打包上传（见 scripts/release-cos-x64.sh）
#
# 为什么不直接在 CI 里传 COS：GitHub runner 在境外、COS 在上海，跨境外网上传太慢
# （常规域名 1.5h+，全球加速也提速有限），故改为：
#   CI → GitHub Releases（站内快）→ 开发者本地下载 → 手工传 COS（国内快）
# 手工传 COS 见 scripts/upload-cos-github.sh
#
# 所需 GitHub Secrets：
# - COS_BUCKET：bucket 全名（如 shadiaoai-1451923852），用于生成应用内更新 URL
# - COS_REGION：地域（如 ap-shanghai），用于生成应用内更新 URL
# - MAC_CERTS：base64 编码的 Developer ID .p12（必须含证书 + 私钥）
# - MAC_CERTS_PASSWORD：导出 .p12 时设置的密码
# - APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID：macOS 公证（notarization，缺一不可）
# GITHUB_TOKEN 由 GitHub Actions 自动提供
#
# 导出 .p12（本地 Keychain Access）：
#   在「钥匙串访问」中找到自己的 Developer ID Application 证书 → 右键导出为 .p12 → 设密码
#   base64 -i cert.p12 | pbcopy → 粘贴为 MAC_CERTS secret（去掉换行）

name: Release to GitHub

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac-arm64:
    name: build (macos-latest, mac, arm64)
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # macOS 代码签名准备（证书已配置，缺任一凭据直接失败，避免静默产出未签名包）
      - name: 导入 macOS 签名证书
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERTS:-}" ] || [ -z "${MAC_CERTS_PASSWORD:-}" ]; then
            echo "::error::MAC_CERTS / MAC_CERTS_PASSWORD 未配置，无法签名。请在仓库 Settings → Secrets and variables → Actions 添加。"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入 .p12（证书+私钥）。用 -T 限定 codesign/productbuild 访问（不要用 -A，否则会报 item already exists）。
          echo "$MAC_CERTS" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/productbuild -P "$MAC_CERTS_PASSWORD"
          rm -f "$CERT_PATH"

          # 关键：分区里必须带 codesign:，否则 codesign 会弹授权框在无头 CI 上卡死（apple-tool:,apple: 只够 notarytool）
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 补 Developer ID 中间证书（G2），保证信任链完整，否则 spctl / codesign --verify 报 CSSMERR_TP_NOT_TRUSTED
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/DeveloperIDG2CA.cer"

          # 追加进搜索列表（保留原有 login/system），并设为默认 keychain
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | sed 's/"//g')"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          # 校验：必须有带私钥的「Developer ID Application」身份
          echo "==> 已导入的签名身份："
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "::error::未找到 Developer ID Application 身份，请确认 .p12 同时包含证书与私钥。"
            exit 1
          fi

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 同步运行时依赖
        run: bun run --filter='@shadiao/electron' sync:runtime-deps
        working-directory: .

      - name: 打包 (macOS arm64)
        env:
          SHADIAO_UPDATE_URL: https://${{ secrets.COS_BUCKET }}.cos.${{ secrets.COS_REGION }}.myqcloud.com/downloads/mac-arm64/
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$SHADIAO_UPDATE_URL" ]; then
            echo "::error::SHADIAO_UPDATE_URL 未设置"
            exit 1
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 未设置，无法公证。"
            exit 1
          fi
          echo "update URL: $SHADIAO_UPDATE_URL"
          success=0
          for i in 1 2 3; do
            echo "electron-builder attempt $i/3..."
            if npx electron-builder --mac --arm64; then
              success=1
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          if [ "$success" -eq 0 ]; then
            echo "::error::electron-builder failed after 3 attempts"
            exit 1
          fi
        working-directory: apps/electron

      - name: 校验签名与公证 (macOS arm64)
        run: |
          set -euo pipefail
          APP="out/mac-arm64/沙雕智能体.app"
          if [ ! -d "$APP" ]; then
            echo "::error::未找到应用包 $APP，请确认产物路径。"
            exit 1
          fi
          echo "==> codesign 深校验："
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "==> Gatekeeper 评估（签名 + 公证）："
          spctl --assess --type execute --verbose=4 "$APP"
          echo "==> 公证票据校验："
          xcrun stapler validate "$APP"
        working-directory: apps/electron

      - name: 整理发布文件 (macOS arm64)
        run: |
          mkdir -p release-files
          cp out/ShaDiaoAgent-*-arm64.dmg release-files/
          cp out/ShaDiaoAgent-*-arm64.zip release-files/
          cp out/ShaDiaoAgent-*-arm64.*.blockmap release-files/
          cp out/latest-mac.yml release-files/
          ls -la release-files/
        working-directory: apps/electron

      - name: 发布到 GitHub Releases (macOS arm64)
        uses: softprops/action-gh-release@v2
        with:
          files: apps/electron/release-files/*
          generate_release_notes: true

  build-windows-x64:
    name: build (windows-latest, win, x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: bun install --frozen-lockfile
        env:
          # Windows runner 上 bun 取依赖偶发证书链校验失败，此处放开校验仅为绕过该问题。
          # 影响范围仅限构建期依赖安装，不进入产物；bun.lock 已固化各 tarball 与哈希，
          # 因此被中间人投毒的风险有限。若后续 runner 环境修复，应移除本行。
          NODE_TLS_REJECT_UNAUTHORIZED: 0

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 同步运行时依赖
        run: bun run --filter='@shadiao/electron' sync:runtime-deps
        working-directory: .

      - name: 打包 (Windows x64)
        env:
          SHADIAO_UPDATE_URL: https://${{ secrets.COS_BUCKET }}.cos.${{ secrets.COS_REGION }}.myqcloud.com/downloads/windows/
        shell: bash
        run: |
          if [ -z "$SHADIAO_UPDATE_URL" ]; then
            echo "::error::SHADIAO_UPDATE_URL 未设置"
            exit 1
          fi
          echo "update URL: $SHADIAO_UPDATE_URL"
          success=0
          for i in 1 2 3; do
            echo "electron-builder attempt $i/3..."
            if npx electron-builder --win --x64; then
              success=1
              break
            fi
            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done
          if [ "$success" -eq 0 ]; then
            echo "::error::electron-builder failed after 3 attempts"
            exit 1
          fi
        working-directory: apps/electron

      - name: 整理发布文件 (Windows x64)
        shell: bash
        run: |
          mkdir -p release-files
          cp out/ShaDiaoAgent-Setup-*.exe release-files/
          cp out/ShaDiaoAgent-Setup-*.exe.blockmap release-files/
          cp out/ShaDiaoAgent-*-portable.zip release-files/
          cp out/latest.yml release-files/
          ls -la release-files/
        working-directory: apps/electron

      - name: 发布到 GitHub Releases (Windows x64)
        uses: softprops/action-gh-release@v2
        with:
          files: apps/electron/release-files/*
          generate_release_notes: true
